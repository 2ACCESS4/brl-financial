<?xml version="1.0" encoding="UTF-8"?>
<svg width="800px" height="600px" viewBox="0 0 800 600" version="1.1" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <!-- Light green background gradient -->
        <linearGradient x1="0%" y1="0%" x2="100%" y2="100%" id="finGradient1">
            <stop stop-color="#e8f5e9" offset="0%"></stop>
            <stop stop-color="#c8e6c9" offset="100%"></stop>
        </linearGradient>
        
        <!-- Light orange background gradient -->
        <linearGradient x1="0%" y1="100%" x2="100%" y2="0%" id="finGradient2">
            <stop stop-color="#fff3e0" offset="0%"></stop>
            <stop stop-color="#ffe0b2" offset="100%"></stop>
        </linearGradient>
        
        <!-- Chart area gradient -->
        <linearGradient x1="50%" y1="0%" x2="50%" y2="100%" id="chartGradient">
            <stop stop-color="#0e703c" stop-opacity="0.4" offset="0%"></stop>
            <stop stop-color="#0e703c" stop-opacity="0.05" offset="100%"></stop>
        </linearGradient>
        
        <!-- Bar gradient -->
        <linearGradient x1="50%" y1="0%" x2="50%" y2="100%" id="barGradient">
            <stop stop-color="#43a047" offset="0%"></stop>
            <stop stop-color="#2e7d32" offset="100%"></stop>
        </linearGradient>
        
        <!-- Shadow filter -->
        <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.2"/>
        </filter>
    </defs>

    <!-- Background shapes -->
    <path d="M500,100 Q650,50 750,200 Q800,400 600,500 Q450,550 550,350 Z" 
          fill="url(#finGradient1)" opacity="0.7"></path>
    <path d="M50,400 Q150,350 200,550 Q300,600 50,500 Z" 
          fill="url(#finGradient2)" opacity="0.6"></path>
    
    <!-- Grid pattern - more subtle and modern -->
    <g stroke="#ddd" stroke-width="0.5" opacity="0.7">
        <g id="horizontal-lines">
            <line x1="100" y1="150" x2="700" y2="150"></line>
            <line x1="100" y1="200" x2="700" y2="200"></line>
            <line x1="100" y1="250" x2="700" y2="250"></line>
            <line x1="100" y1="300" x2="700" y2="300"></line>
            <line x1="100" y1="350" x2="700" y2="350"></line>
            <line x1="100" y1="400" x2="700" y2="400"></line>
            <line x1="100" y1="450" x2="700" y2="450"></line>
        </g>
        <g id="vertical-lines">
            <line x1="150" y1="150" x2="150" y2="450"></line>
            <line x1="200" y1="150" x2="200" y2="450"></line>
            <line x1="250" y1="150" x2="250" y2="450"></line>
            <line x1="300" y1="150" x2="300" y2="450"></line>
            <line x1="350" y1="150" x2="350" y2="450"></line>
            <line x1="400" y1="150" x2="400" y2="450"></line>
            <line x1="450" y1="150" x2="450" y2="450"></line>
            <line x1="500" y1="150" x2="500" y2="450"></line>
            <line x1="550" y1="150" x2="550" y2="450"></line>
            <line x1="600" y1="150" x2="600" y2="450"></line>
            <line x1="650" y1="150" x2="650" y2="450"></line>
            <line x1="700" y1="150" x2="700" y2="450"></line>
        </g>
    </g>

    <!-- Modern Financial chart elements -->
    <g>
        <!-- Chart axes - more subtle -->
        <line x1="100" y1="450" x2="700" y2="450" stroke="#999" stroke-width="1.5"></line>
        <line x1="100" y1="150" x2="100" y2="450" stroke="#999" stroke-width="1.5"></line>
        
        <!-- Modern bar chart with proper shadow and gradients -->
        <g id="bars">
            <rect x="130" y="400" width="30" height="50" rx="2" 
                  fill="url(#barGradient)" filter="url(#dropShadow)"></rect>
            <rect x="180" y="370" width="30" height="80" rx="2" 
                  fill="url(#barGradient)" filter="url(#dropShadow)"></rect>
            <rect x="230" y="330" width="30" height="120" rx="2" 
                  fill="url(#barGradient)" filter="url(#dropShadow)"></rect>
            <rect x="280" y="300" width="30" height="150" rx="2" 
                  fill="url(#barGradient)" filter="url(#dropShadow)"></rect>
        </g>
        
        <!-- Modern line chart with shadow -->
        <path d="M350,350 L400,335 L450,315 L500,290 L550,265 L600,230 L650,190" 
              stroke="#0e703c" 
              stroke-width="3"
              fill="none"
              stroke-linecap="round"
              filter="url(#dropShadow)">
        </path>
        
        <!-- Modern area chart with subtle gradient -->
        <path d="M350,350 L400,335 L450,315 L500,290 L550,265 L600,230 L650,190 L650,450 L350,450 Z"
              fill="url(#chartGradient)">
        </path>
        
        <!-- Chart dots with shadow -->
        <circle cx="350" cy="350" r="5" fill="#0e703c" filter="url(#dropShadow)"></circle>
        <circle cx="400" cy="335" r="5" fill="#0e703c" filter="url(#dropShadow)"></circle>
        <circle cx="450" cy="315" r="5" fill="#0e703c" filter="url(#dropShadow)"></circle>
        <circle cx="500" cy="290" r="5" fill="#0e703c" filter="url(#dropShadow)"></circle>
        <circle cx="550" cy="265" r="5" fill="#0e703c" filter="url(#dropShadow)"></circle>
        <circle cx="600" cy="230" r="5" fill="#0e703c" filter="url(#dropShadow)"></circle>
        <circle cx="650" cy="190" r="6" fill="#0e703c" filter="url(#dropShadow)"></circle>
    </g>
    
    <!-- Modern Financial icons with proper shadow and modern style -->
    <g>
        <!-- Dollar sign circle - similar to example image -->
        <circle cx="180" cy="320" r="25" fill="white" stroke="#0e703c" stroke-width="1.5" filter="url(#dropShadow)"></circle>
        <path d="M180,310 L180,330 M175,315 C175,312 177,310 180,310 C183,310 185,312 185,315 C185,318 180,320 180,320 C180,320 175,322 175,325 C175,328 177,330 180,330 C183,330 185,328 185,325" 
              stroke="#0e703c" 
              stroke-width="2"
              fill="none"
              stroke-linecap="round">
        </path>
        
        <!-- Plus sign circle - similar to example image -->
        <circle cx="570" cy="320" r="25" fill="white" stroke="#ff7e12" stroke-width="1.5" filter="url(#dropShadow)"></circle>
        <path d="M560,320 L580,320 M570,310 L570,330" 
              stroke="#ff7e12" 
              stroke-width="2"
              fill="none"
              stroke-linecap="round">
        </path>
        
        <!-- Checkmark circle - similar to example image -->
        <circle cx="180" cy="420" r="25" fill="white" stroke="#0e703c" stroke-width="1.5" filter="url(#dropShadow)"></circle>
        <path d="M170,420 L178,428 L190,410" 
              stroke="#0e703c" 
              stroke-width="2"
              fill="none"
              stroke-linecap="round"
              stroke-linejoin="round">
        </path>
    </g>
    
    <!-- Decorative elements - more subtle and modern -->
    <g opacity="0.7">
        <!-- Green dots cluster - similar to example image -->
        <circle cx="380" cy="370" r="3" fill="#0e703c"></circle>
        <circle cx="390" cy="380" r="2" fill="#0e703c"></circle>
        <circle cx="385" cy="360" r="4" fill="#0e703c"></circle>
        <circle cx="370" cy="375" r="2" fill="#0e703c"></circle>
        <circle cx="375" cy="365" r="1.5" fill="#0e703c"></circle>
        
        <!-- Orange dots cluster - similar to example image -->
        <circle cx="570" cy="400" r="3" fill="#ff7e12"></circle>
        <circle cx="580" cy="410" r="2" fill="#ff7e12"></circle>
        <circle cx="575" cy="390" r="4" fill="#ff7e12"></circle>
        <circle cx="560" cy="405" r="2" fill="#ff7e12"></circle>
        <circle cx="565" cy="395" r="1.5" fill="#ff7e12"></circle>
    </g>
</svg>