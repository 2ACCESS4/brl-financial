<!DOCTYPE html>
<html>
<head>
  <title>Auto Login Demo</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      max-width: 600px;
      margin: 0 auto;
      padding: 2rem;
      line-height: 1.5;
    }
    h2 {
      color: #155e75;
      margin-bottom: 1.5rem;
    }
    form {
      background-color: #f1f5f9;
      padding: 2rem;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    label {
      display: block;
      margin-bottom: 1rem;
      font-weight: 500;
    }
    input {
      padding: 0.5rem;
      width: 100%;
      margin-top: 0.25rem;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
    }
    button {
      background-color: #0891b2;
      color: white;
      padding: 0.75rem 1.5rem;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 500;
      margin-top: 1rem;
    }
    button:hover {
      background-color: #0e7490;
    }
    .portal-buttons {
      margin-top: 2rem;
    }
    .portal-button {
      margin-right: 0.5rem;
      margin-bottom: 0.5rem;
      background-color: #475569;
    }
    .status {
      margin-top: 1.5rem;
      padding: 1rem;
      background-color: #f0fdfa;
      border-left: 4px solid #0d9488;
      display: none;
    }
  </style>
</head>
<body>
  <h2>BRL Portal Direct Login Test</h2>
  
  <form id="userInputForm" onsubmit="handleLogin(event)">
    <label>Account Code: <input type="text" id="accountCode" required></label>
    <label>Password: <input type="password" id="password" required></label>
    <button type="submit">Login to Insured Portal</button>
  </form>

  <div class="portal-buttons">
    <h3>Or click a button to go directly to a portal:</h3>
    <button class="portal-button" onclick="redirectToPortal('Insured')">Insured Portal</button>
    <button class="portal-button" onclick="redirectToPortal('Insured Español')">Insured Español Portal</button>
    <button class="portal-button" onclick="redirectToPortal('Agent')">Agent Portal</button>
    <button class="portal-button" onclick="redirectToPortal('General Agent')">General Agent Portal</button>
    <button class="portal-button" onclick="redirectToPortal('Sales Rep')">Sales Rep Portal</button>
  </div>

  <div id="status" class="status">
    Submitting to portal...
  </div>

  <!-- Hidden form for auto-submission -->
  <form id="autoLoginForm" action="https://www.fmweb3.com/FMBRL/FMInsuredLogin.asp" method="POST" style="display:none;">
    <input type="hidden" name="AccountCode" id="hiddenAccountCode">
    <input type="hidden" name="Password" id="hiddenPassword">
    <input type="hidden" name="Submit" id="hiddenSubmit" value="Submit">
  </form>

  <script>
    // Portal URLs
    const portalUrls = {
      'Insured': 'https://www.fmweb3.com/FMBRL/FMInsuredLogin.asp',
      'Insured Español': 'https://www.fmweb3.com/FMBRL/FMInsuredLogin.asp?Lang=S',
      'Agent': 'https://www.fmweb3.com/FMBRL/FMAgentLogin.asp',
      'General Agent': 'https://www.fmweb3.com/FMBRL/FMGALogin.asp',
      'Sales Rep': 'https://www.fmweb3.com/FMBRL/FMSalesRepLogin.asp'
    };

    function handleLogin(event) {
      event.preventDefault();
      
      // Show status
      const status = document.getElementById('status');
      status.style.display = 'block';
      
      // Get user input
      const accountCode = document.getElementById('accountCode').value;
      const password = document.getElementById('password').value;

      // Fill hidden form
      document.getElementById('hiddenAccountCode').value = accountCode;
      document.getElementById('hiddenPassword').value = password;
      
      console.log('Submitting with account:', accountCode);

      // Submit hidden form to portal after small delay to show status
      setTimeout(() => {
        document.getElementById('autoLoginForm').submit();
      }, 500);
    }
    
    function redirectToPortal(portalType) {
      // Show status
      const status = document.getElementById('status');
      status.textContent = `Redirecting to ${portalType} portal...`;
      status.style.display = 'block';
      
      // Simply redirect to the portal URL
      setTimeout(() => {
        window.location.href = portalUrls[portalType];
      }, 500);
    }
  </script>
</body>
</html>
