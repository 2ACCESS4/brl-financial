[build]
  command = "chmod +x netlify-build.sh && ./netlify-build.sh"
  publish = "dist/client"
  
[functions]
  directory = "netlify/functions"

# Environment variables
[build.environment]
  NODE_VERSION = "18"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200