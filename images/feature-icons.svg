<?xml version="1.0" encoding="UTF-8"?>
<svg width="600px" height="160px" viewBox="0 0 600 160" version="1.1" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient x1="50%" y1="0%" x2="50%" y2="100%" id="iconGradient1">
            <stop stop-color="#0e703c" stop-opacity="1" offset="0%"></stop>
            <stop stop-color="#0e703c" stop-opacity="0.6" offset="100%"></stop>
        </linearGradient>
        <linearGradient x1="50%" y1="0%" x2="50%" y2="100%" id="iconGradient2">
            <stop stop-color="#ff7e12" stop-opacity="1" offset="0%"></stop>
            <stop stop-color="#ff7e12" stop-opacity="0.6" offset="100%"></stop>
        </linearGradient>
        <linearGradient x1="50%" y1="0%" x2="50%" y2="100%" id="iconGradient3">
            <stop stop-color="#6289bb" stop-opacity="1" offset="0%"></stop>
            <stop stop-color="#6289bb" stop-opacity="0.6" offset="100%"></stop>
        </linearGradient>
        
        <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur in="SourceAlpha" stdDeviation="3"></feGaussianBlur>
            <feOffset dx="0" dy="2" result="offsetBlur"></feOffset>
            <feComponentTransfer>
                <feFuncA type="linear" slope="0.2"></feFuncA>
            </feComponentTransfer>
            <feMerge>
                <feMergeNode></feMergeNode>
                <feMergeNode in="SourceGraphic"></feMergeNode>
            </feMerge>
        </filter>
    </defs>
    
    <!-- Security Icon -->
    <g transform="translate(80, 80)" filter="url(#dropShadow)">
        <circle cx="0" cy="0" r="50" fill="white" stroke="#eee" stroke-width="1"></circle>
        <path d="M-20,-20 L0,-35 L20,-20 L20,10 C10,20 -10,20 -20,10 Z" 
            stroke="url(#iconGradient1)" 
            stroke-width="3"
            fill="none"
            stroke-linejoin="round">
        </path>
        <path d="M-10,-5 L-2,5 L10,-15" 
            stroke="url(#iconGradient1)" 
            stroke-width="3"
            fill="none"
            stroke-linecap="round"
            stroke-linejoin="round">
        </path>
    </g>
    
    <!-- Growth Icon -->
    <g transform="translate(300, 80)" filter="url(#dropShadow)">
        <circle cx="0" cy="0" r="50" fill="white" stroke="#eee" stroke-width="1"></circle>
        <path d="M-25,25 L-25,-5 L5,-5" 
            stroke="url(#iconGradient2)" 
            stroke-width="3"
            fill="none"
            stroke-linecap="round"
            stroke-linejoin="round">
        </path>
        <path d="M-15,-15 L5,-35 L25,-15" 
            stroke="url(#iconGradient2)" 
            stroke-width="3"
            fill="none"
            stroke-linecap="round"
            stroke-linejoin="round">
        </path>
        <path d="M5,-35 L5,25" 
            stroke="url(#iconGradient2)" 
            stroke-width="3"
            fill="none"
            stroke-linecap="round">
        </path>
    </g>
    
    <!-- Support Icon -->
    <g transform="translate(520, 80)" filter="url(#dropShadow)">
        <circle cx="0" cy="0" r="50" fill="white" stroke="#eee" stroke-width="1"></circle>
        <circle cx="0" cy="-15" r="15" 
            stroke="url(#iconGradient3)" 
            stroke-width="3"
            fill="none">
        </circle>
        <path d="M-25,25 C-25,5 25,5 25,25" 
            stroke="url(#iconGradient3)" 
            stroke-width="3"
            fill="none"
            stroke-linecap="round">
        </path>
        <path d="M-12,5 L-12,15 M12,5 L12,15" 
            stroke="url(#iconGradient3)" 
            stroke-width="3"
            fill="none"
            stroke-linecap="round">
        </path>
    </g>
</svg>